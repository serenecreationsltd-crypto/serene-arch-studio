<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Page Not Found — Serene Creations</title>
<link rel="canonical" href="https://www.serenecreations.org/">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07101e;
  --surface:#0e1c30;
  --teal:#0A7E73;
  --gold:#C8920F;
  --text:#e8edf4;
  --muted:#7a91ab;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;padding:48px 24px;text-align:center}
.code{font-size:clamp(5rem,20vw,9rem);font-family:'Playfair Display',serif;font-weight:700;color:var(--teal);line-height:1;margin-bottom:.25em}
h1{font-size:clamp(1.25rem,4vw,2rem);font-weight:700;margin-bottom:.5em}
p{color:var(--muted);font-size:1rem;max-width:36ch;line-height:1.6;margin-bottom:2em}
.links{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
a{text-decoration:none;color:inherit}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:8px;font-size:.9rem;font-weight:600;transition:opacity .2s}
.btn-primary{background:var(--teal);color:#fff}
.btn-primary:hover{opacity:.85}
.btn-ghost{border:1px solid rgba(255,255,255,.15);color:var(--muted)}
.btn-ghost:hover{border-color:var(--teal);color:var(--teal)}
</style>
</head>
<body>
<div class="code">404</div>
<h1>Page not found</h1>
<p>The page you're looking for doesn't exist or may have moved.</p>
<div class="links">
  <a href="/" class="btn btn-primary">← Back to Portal</a>
  <a href="/serene-hub.html" class="btn btn-ghost">Serene Hub</a>
  <a href="/ai-studio.html" class="btn btn-ghost">AI Studio</a>
  <a href="/serene-portal.html" class="btn btn-ghost">Client Portal</a>
</div>
</body>
</html>
