<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#07101e"/>
  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e3550" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Logo mark (scaled up) -->
  <g transform="translate(80, 220)">
    <path d="M130 0 Q130 -40 100 -40 L60 -40 Q30 -40 30 0 Q30 40 60 40 L100 40 Q130 40 130 80 Q130 120 100 120 L60 120 Q30 120 30 160"
          fill="none" stroke="#0A7E73" stroke-width="14" stroke-linecap="round"/>
    <circle cx="80" cy="205" r="9" fill="#C8920F"/>
  </g>

  <!-- Brand name -->
  <text x="280" y="290" font-family="Georgia, serif" font-size="72" font-weight="700" fill="#f0f4f8" letter-spacing="-1">Serene Creations</text>
  <text x="280" y="355" font-family="Georgia, serif" font-size="28" fill="#94a3b8" letter-spacing="2">ARCHITECTURE · DESIGN · AI STUDIO</text>

  <!-- Tagline -->
  <text x="280" y="430" font-family="Arial, sans-serif" font-size="22" fill="#6d8499">Uganda's Premier Architecture &amp; AI Design Studio</text>

  <!-- Gold accent line -->
  <rect x="280" y="390" width="120" height="3" rx="2" fill="#C8920F"/>

  <!-- URL -->
  <text x="80" y="580" font-family="Arial, sans-serif" font-size="20" fill="#4a6280">www.serenecreations.org</text>

  <!-- Teal accent corner -->
  <rect x="1100" y="0" width="100" height="630" fill="#0A7E73" opacity="0.08"/>
</svg>
