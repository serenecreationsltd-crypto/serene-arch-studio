name: Deploy Cloudflare Workers

# Deploys every Worker in workers/<folder>/ that has a wrangler.toml
# (serene-ai-proxy, serene-growth, serene-blog). Authenticated with one
# repository secret, no token in code:
#   CLOUDFLARE_API_TOKEN   API token from the "Edit Cloudflare Workers" template
# The account ID is an identifier, not a secret, so it is set below
# (a CLOUDFLARE_ACCOUNT_ID secret, if present, overrides it).
#
# Each run: 1) build check (wrangler --dry-run, no token needed);
# 2) drift check: compares wrangler.toml with the live Worker and stops if
#    the deploy would remove or change a live binding or setting;
# 3) deploy. Without the token, only step 1 runs and the job passes with a warning.
# See workers/README.md.

on:
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - 'scripts/cf-worker-drift.py'
      - '.github/workflows/cloudflare-workers-deploy.yml'
  workflow_dispatch:
    inputs:
      worker:
        description: 'Folder under workers/ to deploy (leave blank for all)'
        required: false
        default: ''
      allow_drift:
        description: 'Allow config changes (deploy even if wrangler.toml differs from the live Worker)'
        type: boolean
        required: false
        default: false

concurrency:
  group: cloudflare-workers-deploy
  cancel-in-progress: false

env:
  CF_ACCOUNT_ID: aec23a55e10eea9fcb2cb9bcbaf69298   # Serene Creations Ltd Cloudflare account
  WRANGLER_VERSION: 4.139.0
  WRANGLER_SEND_METRICS: 'false'

jobs:
  discover:
    name: Find Workers
    runs-on: ubuntu-latest
    outputs:
      workers: ${{ steps.find.outputs.workers }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        env:
          WANT: ${{ github.event.inputs.worker }}
        run: |
          list=$(for d in workers/*/; do
                   [ -d "$d" ] || continue
                   [ -f "$d/wrangler.toml" ] || continue   # the drift check reads wrangler.toml
                   n=$(basename "$d")
                   if [ -z "$WANT" ] || [ "$WANT" = "$n" ]; then echo "$n"; fi
                 done | jq -R . | jq -sc .)
          [ -n "$list" ] || list='[]'
          echo "workers=$list" >> "$GITHUB_OUTPUT"
          echo "Workers to deploy: $list"

  deploy:
    name: Deploy ${{ matrix.worker }}
    needs: discover
    if: needs.discover.outputs.workers != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJson(needs.discover.outputs.workers) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: workers/${{ matrix.worker }}
        run: |
          if [ -f package-lock.json ]; then npm ci
          elif [ -f package.json ]; then npm install
          else echo "No package.json — plain Worker"; fi

      - name: Build check (no upload)
        working-directory: workers/${{ matrix.worker }}
        run: npx --yes "wrangler@${WRANGLER_VERSION}" deploy --dry-run --outdir "$RUNNER_TEMP/dist"

      - name: Check Cloudflare credentials
        id: creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::warning title=Not deployed (Cloudflare token missing)::Build check passed. Add the repository secret CLOUDFLARE_API_TOKEN (see workers/README.md) and re-run to deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Drift check against the live Worker
        if: steps.creds.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || env.CF_ACCOUNT_ID }}
          ALLOW_DRIFT: ${{ github.event.inputs.allow_drift }}
        run: python3 scripts/cf-worker-drift.py "workers/${{ matrix.worker }}"

      - name: Deploy with Wrangler
        if: steps.creds.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || env.CF_ACCOUNT_ID }}
          workingDirectory: workers/${{ matrix.worker }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: deploy
