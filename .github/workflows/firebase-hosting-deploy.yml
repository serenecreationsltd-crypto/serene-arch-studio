name: Deploy Firebase Hosting

on:
  push:
    branches: [ main ]
    paths:
      - 'public/**'
      - 'firebase.json'
      - '.github/workflows/firebase-hosting-deploy.yml'
  workflow_dispatch:

concurrency:
  group: firebase-hosting-deploy
  cancel-in-progress: false

env:
  FIREBASE_PROJECT: serene-arch-studio

jobs:
  deploy:
    name: Deploy Firebase Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install firebase-tools
        run: npm install -g firebase-tools@13.29.1 --quiet 2>&1 | tail -5

      - name: Write service account key
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > service-account.json

      - name: Deploy to Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: service-account.json
        run: |
          firebase deploy \
            --only hosting \
            --project ${{ env.FIREBASE_PROJECT }} \
            --non-interactive

      - name: Register custom domain serenecreations.org
        run: |
          gcloud auth activate-service-account --key-file=service-account.json --quiet
          TOKEN=$(gcloud auth print-access-token)
          API="https://firebasehosting.googleapis.com/v1beta1/projects/${{ env.FIREBASE_PROJECT }}/sites/${{ env.FIREBASE_PROJECT }}"

          echo "::group::Registering serenecreations.org"
          curl -s -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"domainName":"serenecreations.org"}' \
            "$API/domains" | jq .
          echo "::endgroup::"

          echo "::group::Registering www.serenecreations.org"
          curl -s -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"domainName":"www.serenecreations.org"}' \
            "$API/domains" | jq .
          echo "::endgroup::"

          echo "::group::All domains and required DNS records"
          DOMAINS_JSON=$(curl -s -H "Authorization: Bearer $TOKEN" "$API/domains")
          echo "$DOMAINS_JSON" | jq -r '
            .domains[] |
            "=== DOMAIN: \(.domainName) | STATUS: \(.domainStatus) ===",
            (.provisioning.dnsRequiredRecords // [] | .[] |
              "  ADD DNS: \(.requiredDnsRecord.type) \(.requiredDnsRecord.name) -> \(.requiredDnsRecord.rrdatas | join(", "))"),
            (.provisioning.certChallenge.dnsChallenge.records // [] | .[] |
              "  TXT: \(.name) -> \(.value)"),
            ""
          ' || echo "$DOMAINS_JSON"
          echo "::endgroup::"

          echo "## Cloudflare DNS Records Required" >> $GITHUB_STEP_SUMMARY
          echo "Add these to Cloudflare with **DNS only (grey cloud, proxy OFF)**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "$DOMAINS_JSON" | jq -r '
            .domains[] |
            "### \(.domainName) — Status: \(.domainStatus)",
            "| Type | Name | Value |",
            "|------|------|-------|",
            (.provisioning.dnsRequiredRecords // [] | .[] |
              "| \(.requiredDnsRecord.type) | \(.requiredDnsRecord.name) | \(.requiredDnsRecord.rrdatas | join(", ")) |"),
            (.provisioning.certChallenge.dnsChallenge.records // [] | .[] |
              "| TXT | \(.name) | \(.value) |"),
            ""
          ' >> $GITHUB_STEP_SUMMARY || echo "$DOMAINS_JSON" >> $GITHUB_STEP_SUMMARY

      - name: Clean up service account key
        if: always()
        run: rm -f service-account.json
