name: Deploy Firebase Hosting

on:
  push:
    branches: [ main ]
    paths:
      - 'public/**'
      - '.github/workflows/firebase-hosting-deploy.yml'
  workflow_dispatch:

env:
  FIREBASE_PROJECT: serene-arch-studio

jobs:
  deploy:
    name: Deploy Firebase Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Write service account key
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > service-account.json

      - name: Deploy to Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: service-account.json
        run: |
          firebase deploy \
            --only hosting \
            --project ${{ env.FIREBASE_PROJECT }} \
            --non-interactive

      - name: Install gcloud CLI
        run: |
          curl -sSL https://sdk.cloud.google.com | bash -s -- --disable-prompts --install-dir=/opt/gcloud
          echo "/opt/gcloud/google-cloud-sdk/bin" >> $GITHUB_PATH

      - name: Register custom domain serenecreations.org
        run: |
          /opt/gcloud/google-cloud-sdk/bin/gcloud auth activate-service-account \
            --key-file=service-account.json --quiet
          TOKEN=$(/opt/gcloud/google-cloud-sdk/bin/gcloud auth print-access-token)
          API="https://firebasehosting.googleapis.com/v1beta1/projects/${{ env.FIREBASE_PROJECT }}/sites/${{ env.FIREBASE_PROJECT }}"

          echo "::group::Registering serenecreations.org"
          curl -s -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"domainName":"serenecreations.org"}' \
            "$API/domains" || true
          echo "::endgroup::"

          echo "::group::Registering www.serenecreations.org"
          curl -s -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"domainName":"www.serenecreations.org"}' \
            "$API/domains" || true
          echo "::endgroup::"

          echo "::group::Required DNS Records — add these to Cloudflare (DNS only, grey cloud)"
          curl -s -H "Authorization: Bearer $TOKEN" "$API/domains" | python3 -c "
import json, sys
data = json.load(sys.stdin)
for d in data.get('domains', []):
    print(f\"DOMAIN: {d.get('domainName')}  STATUS: {d.get('domainStatus')}\")
    prov = d.get('provisioning', {})
    for rec in prov.get('dnsRequiredRecords', []):
        r = rec.get('requiredDnsRecord', {})
        print(f\"  ADD: {r.get('type')} {r.get('name')} -> {r.get('rrdatas', [])}\")
    for rec in prov.get('certChallenge', {}).get('dnsChallenge', {}).get('records', []):
        print(f\"  TXT: {rec.get('name')} -> {rec.get('value')}\")
    print()
"
          echo "::endgroup::"

      - name: Clean up service account key
        if: always()
        run: rm -f service-account.json
