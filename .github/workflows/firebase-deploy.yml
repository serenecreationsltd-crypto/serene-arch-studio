name: Deploy Firebase Backend

on:
  push:
    branches: [ main ]
    paths:
      - 'firebase-backend/**'
      - '.github/workflows/firebase-deploy.yml'
  workflow_dispatch: {}

env:
  PROJECT: serene-arch-studio
  REGION: us-central1
  RUNTIME: nodejs20

jobs:
  deploy:
    name: Deploy Cloud Functions
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT }}

      - name: Enable required GCP APIs (best-effort)
        continue-on-error: true
        run: |
          gcloud services enable \
            cloudfunctions.googleapis.com \
            cloudbuild.googleapis.com \
            pubsub.googleapis.com \
            cloudscheduler.googleapis.com \
            --project="${{ env.PROJECT }}" \
            --quiet

      - name: Write Functions .env
        working-directory: firebase-backend/functions
        run: |
          cat > .env <<'ENVEOF'
          SMTP_USER=info@serenecreations.org
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          STRIPE_SECRET=${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
          REPLICATE_TOKEN=${{ secrets.REPLICATE_TOKEN }}
          REPLICATE_MODEL_VERSION=${{ secrets.REPLICATE_MODEL_VERSION }}
          ENVEOF

      - name: Create .gcloudignore (include .env, exclude node_modules)
        working-directory: firebase-backend/functions
        run: |
          cat > .gcloudignore <<'EOF'
          .git
          .gitignore
          node_modules
          EOF

      - name: Install Cloud Function dependencies
        working-directory: firebase-backend/functions
        run: npm install --omit=dev

      - name: Deploy HTTPS functions
        working-directory: firebase-backend/functions
        run: |
          ARGS=(
            --project="${{ env.PROJECT }}"
            --region="${{ env.REGION }}"
            --runtime="${{ env.RUNTIME }}"
            --source=.
            --trigger-http
            --allow-unauthenticated
            --quiet
          )
          for fn in \
            trackLead \
            getUsageStats \
            contactFormSubmit \
            adminStats \
            stripeWebhook \
            approveRender \
            exportUsageCSV \
            subscribeToCampaign \
            unsubscribeEmail; do
            echo "▶ Deploying $fn ..."
            gcloud functions deploy "$fn" "${ARGS[@]}" --entry-point="$fn"
          done

      - name: Deploy processRenderJob (Firestore trigger)
        working-directory: firebase-backend/functions
        run: |
          gcloud functions deploy processRenderJob \
            --project="${{ env.PROJECT }}" \
            --region="${{ env.REGION }}" \
            --runtime="${{ env.RUNTIME }}" \
            --source=. \
            --trigger-event="providers/cloud.firestore/eventTypes/document.create" \
            --trigger-resource="projects/${{ env.PROJECT }}/databases/(default)/documents/renderQueue/{jobId}" \
            --memory=512MB \
            --timeout=300s \
            --entry-point=processRenderJob \
            --quiet

      - name: Deploy onUserCreated (Firestore trigger)
        working-directory: firebase-backend/functions
        run: |
          gcloud functions deploy onUserCreated \
            --project="${{ env.PROJECT }}" \
            --region="${{ env.REGION }}" \
            --runtime="${{ env.RUNTIME }}" \
            --source=. \
            --trigger-event="providers/cloud.firestore/eventTypes/document.create" \
            --trigger-resource="projects/${{ env.PROJECT }}/databases/(default)/documents/users/{uid}" \
            --entry-point=onUserCreated \
            --quiet

      - name: Deploy scheduledCleanup (Pub/Sub + Cloud Scheduler)
        working-directory: firebase-backend/functions
        run: |
          TOPIC="firebase-schedule-scheduledCleanup-${{ env.REGION }}"

          # Ensure Pub/Sub topic exists (no-op if already there)
          gcloud pubsub topics create "$TOPIC" \
            --project="${{ env.PROJECT }}" 2>/dev/null \
            || echo "  Topic $TOPIC already exists"

          # Deploy the function
          gcloud functions deploy scheduledCleanup \
            --project="${{ env.PROJECT }}" \
            --region="${{ env.REGION }}" \
            --runtime="${{ env.RUNTIME }}" \
            --source=. \
            --trigger-topic="$TOPIC" \
            --memory=256MB \
            --timeout=540s \
            --entry-point=scheduledCleanup \
            --quiet

          # Create or update the Cloud Scheduler job
          gcloud scheduler jobs create pubsub "$TOPIC" \
            --project="${{ env.PROJECT }}" \
            --location="${{ env.REGION }}" \
            --schedule="0 2 * * *" \
            --time-zone="Africa/Kampala" \
            --topic="$TOPIC" \
            --message-body="{}" 2>/dev/null \
          || gcloud scheduler jobs update pubsub "$TOPIC" \
            --project="${{ env.PROJECT }}" \
            --location="${{ env.REGION }}" \
            --schedule="0 2 * * *" \
            --time-zone="Africa/Kampala" 2>/dev/null \
          || echo "  Scheduler job for scheduledCleanup — verify in GCP Console"

      - name: Deploy scheduledDripSend (Pub/Sub + Cloud Scheduler)
        working-directory: firebase-backend/functions
        run: |
          TOPIC="firebase-schedule-scheduledDripSend-${{ env.REGION }}"

          # Ensure Pub/Sub topic exists (no-op if already there)
          gcloud pubsub topics create "$TOPIC" \
            --project="${{ env.PROJECT }}" 2>/dev/null \
            || echo "  Topic $TOPIC already exists"

          # Deploy the function
          gcloud functions deploy scheduledDripSend \
            --project="${{ env.PROJECT }}" \
            --region="${{ env.REGION }}" \
            --runtime="${{ env.RUNTIME }}" \
            --source=. \
            --trigger-topic="$TOPIC" \
            --memory=256MB \
            --timeout=300s \
            --entry-point=scheduledDripSend \
            --quiet

          # Create or update the Cloud Scheduler job
          gcloud scheduler jobs create pubsub "$TOPIC" \
            --project="${{ env.PROJECT }}" \
            --location="${{ env.REGION }}" \
            --schedule="0 8 * * *" \
            --time-zone="Africa/Kampala" \
            --topic="$TOPIC" \
            --message-body="{}" 2>/dev/null \
          || gcloud scheduler jobs update pubsub "$TOPIC" \
            --project="${{ env.PROJECT }}" \
            --location="${{ env.REGION }}" \
            --schedule="0 8 * * *" \
            --time-zone="Africa/Kampala" 2>/dev/null \
          || echo "  Scheduler job for scheduledDripSend — verify in GCP Console"

      - name: Deploy Firestore & Storage rules (best-effort)
        if: always()
        continue-on-error: true
        working-directory: firebase-backend
        run: |
          npm install -g firebase-tools@12.9.1 --quiet 2>&1 | tail -5
          firebase deploy --only firestore:rules,storage \
            --project "${{ env.PROJECT }}" \
            --non-interactive 2>&1 | tail -20 || true
