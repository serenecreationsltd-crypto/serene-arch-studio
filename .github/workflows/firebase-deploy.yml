name: Deploy Firebase Backend

on:
  push:
    branches: [ main ]
    paths:
      - 'firebase-backend/**'
      - '.github/workflows/firebase-deploy.yml'
  workflow_dispatch: {}

concurrency:
  group: firebase-functions-deploy
  cancel-in-progress: false

env:
  PROJECT: serene-arch-studio
  REGION: us-central1
  RUNTIME: nodejs20

jobs:
  deploy:
    name: Deploy Cloud Functions
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT }}

      # Non-fatal: these APIs are normally already enabled, and the deploy
      # account may lack serviceusage.services.enable. If an API really is
      # missing, the firebase deploy step below fails with a clear message.
      - name: Enable required GCP APIs
        continue-on-error: true
        run: |
          gcloud services enable \
            cloudfunctions.googleapis.com \
            cloudbuild.googleapis.com \
            pubsub.googleapis.com \
            cloudscheduler.googleapis.com \
            cloudbilling.googleapis.com \
            --project="${{ env.PROJECT }}" \
            --quiet

      - name: Write Functions .env
        working-directory: firebase-backend/functions
        run: |
          echo "SMTP_USER=info@serenecreations.org" > .env
          echo "SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}" >> .env
          echo "STRIPE_SECRET=${{ secrets.STRIPE_SECRET_KEY }}" >> .env
          echo "STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}" >> .env
          echo "REPLICATE_TOKEN=${{ secrets.REPLICATE_TOKEN }}" >> .env
          # Optional — model names resolve to their latest version at runtime;
          # the *_VERSION secrets only pin a specific hash. Unset = defaults.
          echo "REPLICATE_MODEL=${{ secrets.REPLICATE_MODEL }}" >> .env
          echo "REPLICATE_MODEL_VERSION=${{ secrets.REPLICATE_MODEL_VERSION }}" >> .env
          echo "REPLICATE_VIDEO_MODEL=${{ secrets.REPLICATE_VIDEO_MODEL }}" >> .env
          echo "REPLICATE_VIDEO_MODEL_VERSION=${{ secrets.REPLICATE_VIDEO_MODEL_VERSION }}" >> .env
          echo "DRIP_SECRET=${{ secrets.DRIP_SECRET }}" >> .env

      - name: Install Cloud Function dependencies
        working-directory: firebase-backend/functions
        run: npm install --omit=dev

      - name: Install firebase-tools
        run: npm install -g firebase-tools@13.29.1 --quiet 2>&1 | tail -5

      - name: Deploy all Cloud Functions via Firebase CLI
        working-directory: firebase-backend
        run: |
          set +e            # default shell is bash -e; keep going so we can report the error
          set -o pipefail   # but take firebase's exit code, not tee's
          firebase deploy --only functions \
            --project "${{ env.PROJECT }}" \
            --non-interactive 2>&1 | tee deploy-output.log; EXIT=$?
          if [ -f firebase-debug.log ]; then
            echo "=== firebase-debug.log (last 40 lines) ==="
            tail -40 firebase-debug.log
          fi
          if [ $EXIT -ne 0 ]; then
            # Surface the real cause as annotations (readable via the checks API,
            # unlike raw logs). If it's a permission error, the fix is
            # scripts/fix-iam-permissions.sh run once in Cloud Shell.
            grep -iE "error|denied|permission|forbidden|not enabled|billing" deploy-output.log \
              | grep -v "^\s*$" | tail -8 \
              | while IFS= read -r line; do echo "::error title=firebase deploy::${line}"; done
            if grep -qiE "permission|denied|forbidden|403" deploy-output.log; then
              echo "::error title=Deploy account lacks permissions::Run scripts/fix-iam-permissions.sh once in Google Cloud Shell as project Owner, then re-run this workflow."
            fi
          fi
          exit $EXIT

      - name: Deploy processVideoJob (Firestore trigger — separate for memory/timeout)
        continue-on-error: true
        working-directory: firebase-backend/functions
        run: |
          gcloud functions deploy processVideoJob \
            --project="${{ env.PROJECT }}" \
            --region="${{ env.REGION }}" \
            --runtime="${{ env.RUNTIME }}" \
            --source=. \
            --trigger-event="providers/cloud.firestore/eventTypes/document.create" \
            --trigger-resource="projects/${{ env.PROJECT }}/databases/(default)/documents/videoQueue/{jobId}" \
            --memory=1GB \
            --timeout=600s \
            --entry-point=processVideoJob \
            --quiet 2>&1 || echo "⚠ processVideoJob gcloud deploy failed — it may already be deployed via firebase CLI above"

      - name: Deploy scheduledCleanup (Pub/Sub + Cloud Scheduler)
        working-directory: firebase-backend/functions
        run: |
          TOPIC="firebase-schedule-scheduledCleanup-${{ env.REGION }}"

          # Ensure Pub/Sub topic exists (no-op if already there)
          gcloud pubsub topics create "$TOPIC" \
            --project="${{ env.PROJECT }}" 2>/dev/null \
            || echo "  Topic $TOPIC already exists"

          # Create or update the Cloud Scheduler job
          gcloud scheduler jobs create pubsub "$TOPIC" \
            --project="${{ env.PROJECT }}" \
            --location="${{ env.REGION }}" \
            --schedule="0 2 * * *" \
            --time-zone="Africa/Kampala" \
            --topic="$TOPIC" \
            --message-body="{}" 2>/dev/null \
          || gcloud scheduler jobs update pubsub "$TOPIC" \
            --project="${{ env.PROJECT }}" \
            --location="${{ env.REGION }}" \
            --schedule="0 2 * * *" \
            --time-zone="Africa/Kampala" 2>/dev/null \
          || echo "  Scheduler job for scheduledCleanup — verify in GCP Console"

      - name: Deploy scheduledDripSend (Pub/Sub + Cloud Scheduler)
        working-directory: firebase-backend/functions
        run: |
          TOPIC="firebase-schedule-scheduledDripSend-${{ env.REGION }}"

          # Ensure Pub/Sub topic exists (no-op if already there)
          gcloud pubsub topics create "$TOPIC" \
            --project="${{ env.PROJECT }}" 2>/dev/null \
            || echo "  Topic $TOPIC already exists"

          # Create or update the Cloud Scheduler job
          gcloud scheduler jobs create pubsub "$TOPIC" \
            --project="${{ env.PROJECT }}" \
            --location="${{ env.REGION }}" \
            --schedule="0 8 * * *" \
            --time-zone="Africa/Kampala" \
            --topic="$TOPIC" \
            --message-body="{}" 2>/dev/null \
          || gcloud scheduler jobs update pubsub "$TOPIC" \
            --project="${{ env.PROJECT }}" \
            --location="${{ env.REGION }}" \
            --schedule="0 8 * * *" \
            --time-zone="Africa/Kampala" 2>/dev/null \
          || echo "  Scheduler job for scheduledDripSend — verify in GCP Console"

      - name: Deploy Firestore & Storage rules
        if: always()
        continue-on-error: true
        working-directory: firebase-backend
        run: |
          firebase deploy --only firestore,storage \
            --project "${{ env.PROJECT }}" \
            --non-interactive 2>&1 | tail -20 || true
