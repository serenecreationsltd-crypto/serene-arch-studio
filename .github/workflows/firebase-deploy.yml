name: Deploy Firebase Backend

on:
  push:
    branches: [ main ]
    paths:
      - 'firebase-backend/**'
      - '.github/workflows/firebase-deploy.yml'
  workflow_dispatch: {}

env:
  FIREBASE_PROJECT: serene-arch-studio

jobs:
  deploy:
    name: Deploy Firebase Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install firebase-tools
        # Pin to 12.x — v13+ added an Artifact Registry pre-check that requires
        # roles/serviceusage.serviceUsageAdmin, which Gen 1 functions don't need.
        # v12.9.1 deploys Gen 1 functions via Cloud Storage (no AR needed).
        run: npm install -g firebase-tools@12.9.1

      - name: Install Cloud Function dependencies
        working-directory: firebase-backend/functions
        run: npm install --omit=dev

      - name: Write service account key
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > firebase-backend/functions/service-account.json

      - name: Write Functions .env (replaces decommissioned functions:config)
        working-directory: firebase-backend/functions
        run: |
          cat > .env <<ENVEOF
          SMTP_USER=info@serenecreations.org
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          STRIPE_SECRET=${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
          REPLICATE_TOKEN=${{ secrets.REPLICATE_TOKEN }}
          REPLICATE_MODEL_VERSION=${{ secrets.REPLICATE_MODEL_VERSION }}
          ENVEOF
          echo "Wrote .env with $(grep -c '=' .env) keys"

      - name: Deploy Cloud Functions (required — AI render engine)
        working-directory: firebase-backend
        env:
          GOOGLE_APPLICATION_CREDENTIALS: functions/service-account.json
        run: |
          set +e
          firebase deploy --only functions \
            --project ${{ env.FIREBASE_PROJECT }} \
            --non-interactive 2>&1 | tee deploy.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error::functions deploy failed (exit $code)"
            echo "--- lines matching Error/permission/HTTP ---"
            grep -iE "error|permission|HTTP [0-9]|denied|not enabled|serviceusage|SERVICE_DISABLED|quota" deploy.log \
              | sed 's/\x1b\[[0-9;]*m//g' | while IFS= read -r l; do echo "::error::$l"; done
            echo "--- last 40 lines ---"
            tail -n 40 deploy.log | sed 's/\x1b\[[0-9;]*m//g' | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit "$code"

      - name: Deploy Firestore & Storage rules (best-effort)
        if: always()
        working-directory: firebase-backend
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: functions/service-account.json
        run: |
          set +e
          firebase deploy --only firestore:rules,storage \
            --project ${{ env.FIREBASE_PROJECT }} \
            --non-interactive 2>&1 | tee rules.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::warning::rules/storage deploy skipped (exit $code). The deploy service account needs the 'Firebase Rules Admin' (roles/firebaserules.admin) role, or deploy rules manually from the Firebase console."
          fi
          exit 0
