name: Deploy Firebase Backend

on:
  push:
    branches: [ main ]
    paths:
      - 'firebase-backend/**'

env:
  FIREBASE_PROJECT: serene-arch-studio

jobs:
  deploy:
    name: Deploy Firebase Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Install Cloud Function dependencies
        working-directory: firebase-backend/functions
        run: npm install --omit=dev

      - name: Write service account key
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > firebase-backend/functions/service-account.json

      - name: Write Functions .env (replaces decommissioned functions:config)
        working-directory: firebase-backend/functions
        run: |
          cat > .env <<ENVEOF
          SMTP_USER=info@serenecreations.org
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          STRIPE_SECRET=${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
          REPLICATE_TOKEN=${{ secrets.REPLICATE_TOKEN }}
          REPLICATE_MODEL_VERSION=${{ secrets.REPLICATE_MODEL_VERSION }}
          ENVEOF
          echo "Wrote .env with $(grep -c '=' .env) keys"

      - name: Deploy to Firebase
        working-directory: firebase-backend
        env:
          GOOGLE_APPLICATION_CREDENTIALS: functions/service-account.json
        run: |
          firebase deploy \
            --only functions,firestore:rules,storage \
            --project ${{ env.FIREBASE_PROJECT }} \
            --non-interactive
